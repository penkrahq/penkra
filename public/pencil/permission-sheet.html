<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      *, ::before, ::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div
      data-pencil-id="Vk4Rp"
      data-pencil-name="Permission Sheet — Ledger install"
      style="align-items: flex-start; background-color: #0B0C10; border-radius: 14px; border: 1px solid #26272E; box-sizing: border-box; display: flex; flex-direction: column; flex-shrink: 0; gap: 16px; height: fit-content; justify-content: flex-start; padding: 24px; width: 440px"
    >
      <div
        data-pencil-id="X0kDF"
        data-pencil-name="Head"
        style="align-items: center; box-sizing: border-box; display: flex; flex-direction: row; flex-shrink: 0; gap: 10px; height: fit-content; justify-content: flex-start; width: 100%"
      >
        <div
          data-pencil-id="bNTE2"
          data-pencil-name="Icon"
          style="align-items: flex-start; background-color: #5B9CF6; border-radius: 7px; box-sizing: border-box; display: flex; flex-direction: row; flex-shrink: 0; gap: 0px; height: 32px; justify-content: flex-start; width: 32px"
        ></div>
        <div
          data-pencil-id="eHPtT"
          data-pencil-name="Title"
          style='box-sizing: border-box; color: #E8EAF2; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; font-size: 15px; font-style: normal; font-weight: 600; letter-spacing: 0px; line-height: normal; text-align: left; white-space: nowrap'
        >
          Ledger wants to:
        </div>
      </div>
      <div
        data-pencil-id="cQi5U"
        data-pencil-name="Required Section"
        style="align-items: flex-start; box-sizing: border-box; display: flex; flex-direction: column; flex-shrink: 0; gap: 2px; height: fit-content; justify-content: flex-start; width: 100%"
      >
        <div
          data-pencil-id="cSjAh"
          data-pencil-name="Heading"
          style='box-sizing: border-box; color: #6B7088; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; font-size: 11px; font-style: normal; font-weight: 600; letter-spacing: 0px; line-height: normal; text-align: left; white-space: nowrap'
        >
          Required — Ledger can't work without these
        </div>
        <div
          data-pencil-id="tI7Fr"
          data-pencil-name="Internet"
          style="align-items: flex-start; box-sizing: border-box; display: flex; flex-direction: column; flex-shrink: 0; gap: 4px; height: fit-content; justify-content: flex-start; padding: 10px 0px; width: 100%"
        >
          <div
            data-pencil-id="B8PAP"
            data-pencil-name="Head"
            style="align-items: center; box-sizing: border-box; display: flex; flex-direction: row; flex-shrink: 0; gap: 8px; height: fit-content; justify-content: flex-start; width: 100%"
          >
            <div
              data-pencil-id="yuIzj"
              data-pencil-name="Title"
              style='box-sizing: border-box; color: #E8EAF2; flex: 1 1 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; font-size: 13px; font-style: normal; font-weight: 600; letter-spacing: 0px; line-height: normal; text-align: left'
            >
              Connect to the internet
            </div>
            <div
              data-pencil-id="StXXb"
              data-pencil-name="Toggle"
              style="align-items: center; background-color: #3B82F6; border-radius: 999px; box-sizing: border-box; display: flex; flex-direction: row; flex-shrink: 0; gap: 0px; height: 20px; justify-content: flex-start; padding: 2px 2px 2px 18px; width: 36px"
            >
              <div
                data-pencil-id="RAPse"
                data-pencil-name="Thumb"
                style="align-items: flex-start; background-color: #FFFFFF; border-radius: 999px; box-sizing: border-box; display: flex; flex-direction: row; flex-shrink: 0; gap: 0px; height: 16px; justify-content: flex-start; width: 16px"
              ></div>
            </div>
          </div>
          <div
            data-pencil-id="jl5jN"
            data-pencil-name="Reason"
            style='box-sizing: border-box; color: #6B7088; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; font-size: 12px; font-style: normal; font-weight: 400; letter-spacing: 0px; line-height: normal; text-align: left; width: 100%'
          >
            "Sync your invoices with your Ledger account."
          </div>
        </div>
      </div>
      <div
        data-pencil-id="dy45v"
        data-pencil-name="Optional Section"
        style="align-items: flex-start; box-sizing: border-box; display: flex; flex-direction: column; flex-shrink: 0; gap: 2px; height: fit-content; justify-content: flex-start; width: 100%"
      >
        <div
          data-pencil-id="IPMm3"
          data-pencil-name="Heading"
          style='box-sizing: border-box; color: #6B7088; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; font-size: 11px; font-style: normal; font-weight: 600; letter-spacing: 0px; line-height: normal; text-align: left; white-space: nowrap'
        >
          Optional — you can turn these off
        </div>
      </div>
    </div>
  </body>
</html>
