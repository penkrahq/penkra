<!doctype html><html><head><title>Penkra QA event probe</title><style>body{margin:12px;font:16px system-ui;min-height:2500px}button,input,select{display:block;margin:10px 0;padding:12px}#covered{position:relative;width:200px;height:70px}#cover{position:absolute;inset:0;background:#999;z-index:10}#animation{position:fixed;right:10px;top:10px;width:25px;height:25px;background:blue}</style></head><body>
<button id="probeClick" aria-label="Click probe">Click probe</button><input id="probeType" aria-label="Text probe"><input id="probeUpload" type="file" aria-label="Upload probe"><select id="probeSelect" aria-label="Select probe"><option>A</option><option>B</option></select><div id="covered"><button id="coveredButton" aria-label="Covered probe">Covered probe</button><div id="cover"></div></div><div id="animation"></div>
<script>
window.qaPageEvents=[];window.qaClicks=0;window.qaCase="bootstrap";
const record=(kind,data={})=>{const row={caseId:window.qaCase,kind,epochMs:Date.now(),pageMonotonicMs:performance.now(),visibility:document.visibilityState,focus:document.hasFocus(),...data};window.qaPageEvents.push(row);console.log('QA_PAGE_EVENT '+JSON.stringify(row));};
for(const type of ['pointerdown','pointerup','mousedown','mouseup','click','input','change','focusin','focusout'])document.addEventListener(type,event=>{if(event.target?.id==='probeClick'&&type==='click')window.qaClicks++;record(type,{target:event.target?.id,isTrusted:event.isTrusted,value:event.target?.value,files:event.target?.files?Array.from(event.target.files).map(f=>f.name):undefined});},true);
window.addEventListener('scroll',event=>record('scroll',{isTrusted:event.isTrusted,scrollY:window.scrollY}));document.addEventListener('visibilitychange',()=>record('visibilitychange'));window.addEventListener('focus',()=>record('window-focus'));window.addEventListener('blur',()=>record('window-blur'));
window.qaState=()=>({caseId:window.qaCase,events:window.qaPageEvents,clicks:window.qaClicks,text:document.getElementById('probeType').value,files:Array.from(document.getElementById('probeUpload').files).map(f=>f.name),scrollY:window.scrollY,visibility:document.visibilityState,focus:document.hasFocus(),epochMs:Date.now()});
window.qaReset=(id)=>{window.qaCase=id;window.qaPageEvents=[];window.qaClicks=0;document.getElementById('probeType').value='';document.getElementById('probeUpload').value='';window.scrollTo(0,0);};
let tick=0;function frame(){document.getElementById('animation').style.opacity=(tick++%60)/60;requestAnimationFrame(frame);}requestAnimationFrame(frame);record('ready');
</script></body></html>
