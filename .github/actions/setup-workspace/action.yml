name: Setup Penkra workspace
description: Install the pinned runtimes, restore job-local caches, and install workspace dependencies.

inputs:
  cache-suffix:
    description: Stable cache namespace for the calling job.
    required: true

runs:
  using: composite
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: package.json

    - name: Setup Node
      uses: actions/setup-node@v6
      with:
        node-version-file: package.json

    - name: Cache Bun and Turbo
      uses: actions/cache@v5
      with:
        path: |
          ~/.bun/install/cache
          .turbo
        key: ${{ runner.os }}-${{ inputs.cache-suffix }}-copyfile-v1-bun-${{ hashFiles('bun.lock') }}-${{ hashFiles('turbo.json') }}
        restore-keys: |
          ${{ runner.os }}-${{ inputs.cache-suffix }}-copyfile-v1-bun-${{ hashFiles('bun.lock') }}-
          ${{ runner.os }}-${{ inputs.cache-suffix }}-copyfile-v1-bun-

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile --backend=copyfile
