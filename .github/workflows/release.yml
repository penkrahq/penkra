name: Release Penkra Desktop

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing stable tag to rebuild
        required: true
        type: string

concurrency:
  group: penkra-desktop-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  PENKRA_REQUIRED_APPS_SOURCE_PATH: .release-inputs/penkra-apps/apps

permissions:
  actions: read
  checks: read
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }} release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    environment: desktop-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            runner: macos-26
            platform: mac
            target: dmg
            arch: arm64
            artifact: mac-arm64
          - name: Linux x64
            runner: ubuntu-24.04
            platform: linux
            target: AppImage
            arch: x64
            artifact: linux-x64
          - name: Windows x64
            runner: windows-2025
            platform: win
            target: nsis
            arch: x64
            artifact: windows-x64
    permissions:
      actions: read
      checks: read
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Resolve and validate release identity
        id: release
        shell: bash
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG}"
          version="${tag#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Stable releases require an exact vMAJOR.MINOR.PATCH tag, got: $tag" >&2
            exit 1
          fi

          node --input-type=module - "$version" <<'NODE'
          import { readFileSync } from "node:fs";

          const version = process.argv[2];
          const manifests = [
            "apps/desktop/package.json",
            "apps/server/package.json",
            "apps/web/package.json",
            "packages/contracts/package.json",
          ];
          for (const manifest of manifests) {
            const actual = JSON.parse(readFileSync(manifest, "utf8")).version;
            if (actual !== version) {
              throw new Error(`${manifest} is ${actual}; release tag requires ${version}`);
            }
          }
          NODE

          source_commit="$(git rev-parse HEAD)"
          lockfile_sha256="$(node --input-type=module -e 'import { createHash } from "node:crypto"; import { readFileSync } from "node:fs"; process.stdout.write(createHash("sha256").update(readFileSync("bun.lock")).digest("hex"));')"
          required_apps_commit="$(node -e "process.stdout.write(require('./required-apps.lock.json').sourceCommit)")"
          {
            echo "version=$version"
            echo "source_commit=$source_commit"
            echo "lockfile_sha256=$lockfile_sha256"
            echo "required_apps_commit=$required_apps_commit"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout pinned required Apps source
        uses: actions/checkout@v6
        with:
          repository: penkrahq/penkra-apps
          ref: ${{ steps.release.outputs.required_apps_commit }}
          path: .release-inputs/penkra-apps
          persist-credentials: false

      - name: Require successful CI for the exact tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ steps.release.outputs.source_commit }}
        shell: bash
        run: |
          set -euo pipefail
          successful_gate_count="$(
            gh api "repos/${GITHUB_REPOSITORY}/commits/${SOURCE_COMMIT}/check-runs?per_page=100" \
              --jq '[.check_runs[] | select(.name == "Penkra CI Quality Gate" and .conclusion == "success" and .app.slug == "github-actions")] | length'
          )"
          if (( successful_gate_count < 1 )); then
            echo "Release requires a successful Penkra CI Quality Gate for ${SOURCE_COMMIT}." >&2
            exit 1
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Linux desktop runtime
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes dbus-x11 gnome-keyring libsecret-tools xvfb

      - name: Require production registry trust anchors
        env:
          PENKRA_REGISTRY_TRUSTED_KEYS: ${{ vars.PENKRA_REGISTRY_TRUSTED_KEYS }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const raw = process.env.PENKRA_REGISTRY_TRUSTED_KEYS?.trim();
          if (!raw) throw new Error("Missing desktop-release variable: PENKRA_REGISTRY_TRUSTED_KEYS");
          const keys = JSON.parse(raw);
          if (!Array.isArray(keys) || keys.length === 0) {
            throw new Error("PENKRA_REGISTRY_TRUSTED_KEYS must contain at least one key");
          }
          for (const key of keys) {
            if (
              key?.kty !== "OKP" ||
              key?.crv !== "Ed25519" ||
              key?.alg !== "EdDSA" ||
              key?.use !== "sig" ||
              typeof key?.x !== "string" ||
              key.x.length === 0 ||
              typeof key?.kid !== "string" ||
              key.kid.length === 0
            ) {
              throw new Error("PENKRA_REGISTRY_TRUSTED_KEYS contains an invalid key");
            }
          }
          NODE

      - name: Build desktop pipeline
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          PENKRA_REGISTRY_TRUSTED_KEYS: ${{ vars.PENKRA_REGISTRY_TRUSTED_KEYS }}
        run: bun run build:desktop

      - name: Reconcile Windows generated build artifacts
        if: matrix.platform == 'win'
        shell: bash
        run: |
          set -euo pipefail
          for generated_path in bun.lock apps/web/public/mockServiceWorker.js apps/web/src/routeTree.gen.ts; do
            if ! git diff --quiet -- "$generated_path"; then
              git show "HEAD:$generated_path" > "$generated_path"
            fi
            expected_blob="$(git rev-parse "HEAD:$generated_path")"
            actual_blob="$(git hash-object "$generated_path")"
            if [[ "$actual_blob" != "$expected_blob" ]]; then
              echo "Windows generated artifact does not match tagged source: $generated_path" >&2
              exit 1
            fi
            git update-index --assume-unchanged "$generated_path"
          done
          if [[ -n "$(git status --porcelain --untracked-files=no)" ]]; then
            git status --short --untracked-files=no
            echo "Windows build changed tracked release source outside the approved generated artifacts." >&2
            exit 1
          fi

      - name: Require macOS signing configuration
        if: matrix.platform == 'mac'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_TEAM_ID; do
            test -n "${!name:-}" || { echo "Missing required release secret: $name" >&2; exit 1; }
          done
          printf '%s' "$APPLE_API_KEY" > "$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"

      - name: Build signed and notarized macOS artifact
        if: matrix.platform == 'mac'
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ runner.temp }}/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        shell: bash
        run: |
          set -euo pipefail
          bun run dist:desktop:artifact -- \
            --platform mac --target dmg --arch arm64 \
            --build-version "${{ steps.release.outputs.version }}" \
            --source-commit "${{ steps.release.outputs.source_commit }}" \
            --source-tag "${RELEASE_TAG}" \
            --lockfile-sha256 "${{ steps.release.outputs.lockfile_sha256 }}" \
            --skip-build --signed --verbose

      - name: Build Linux artifact
        if: matrix.platform == 'linux'
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        shell: bash
        run: |
          set -euo pipefail
          bun run dist:desktop:artifact -- \
            --platform linux --target AppImage --arch x64 \
            --build-version "${{ steps.release.outputs.version }}" \
            --source-commit "${{ steps.release.outputs.source_commit }}" \
            --source-tag "${RELEASE_TAG}" \
            --lockfile-sha256 "${{ steps.release.outputs.lockfile_sha256 }}" \
            --skip-build --verbose

      - name: Build unsigned Windows installer
        if: matrix.platform == 'win'
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        shell: bash
        run: |
          set -euo pipefail
          bun run dist:desktop:artifact -- \
            --platform win --target nsis --arch x64 \
            --build-version "${{ steps.release.outputs.version }}" \
            --source-commit "${{ steps.release.outputs.source_commit }}" \
            --source-tag "${RELEASE_TAG}" \
            --lockfile-sha256 "${{ steps.release.outputs.lockfile_sha256 }}" \
            --skip-build --verbose

      - name: Verify macOS artifact
        if: matrix.platform == 'mac'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          bun run release:smoke:mac-update -- --artifact-dir release
          node scripts/verify-packaged-desktop-startup.ts --assets-dir release --platform mac --arch arm64 --version "${{ steps.release.outputs.version }}"
          if ditto -l -k release/*.zip | grep -q '/Contents/Resources/penkra-cli/'; then
            echo "Public desktop artifact contains the private Penkra CLI." >&2
            exit 1
          fi
          node scripts/write-release-artifact-provenance.ts \
            --assets-dir release --platform mac --arch arm64 --target dmg \
            --version "${{ steps.release.outputs.version }}" \
            --source-commit "${{ steps.release.outputs.source_commit }}" \
            --source-tag "${RELEASE_TAG}" \
            --lockfile-sha256 "${{ steps.release.outputs.lockfile_sha256 }}" \
            --publication true --signed true --expected-mac-team-id "$APPLE_TEAM_ID"

      - name: Verify Linux artifact
        if: matrix.platform == 'linux'
        env:
          PENKRA_CI_KEYRING_PASSWORD: penkra-ci-isolated-keyring
        shell: bash
        run: |
          set -euo pipefail
          export PENKRA_PACKAGE_VERSION="${{ steps.release.outputs.version }}"
          dbus-run-session -- bash -euo pipefail -c '
            export XDG_CURRENT_DESKTOP=GNOME
            keyring_environment="$(printf "%s" "$PENKRA_CI_KEYRING_PASSWORD" | gnome-keyring-daemon --unlock --components=secrets)"
            eval "$keyring_environment"
            node scripts/verify-packaged-desktop-startup.ts \
              --assets-dir release \
              --platform linux \
              --arch x64 \
              --version "$PENKRA_PACKAGE_VERSION"
          '
          node scripts/write-release-artifact-provenance.ts \
            --assets-dir release --platform linux --arch x64 --target AppImage \
            --version "${{ steps.release.outputs.version }}" \
            --source-commit "${{ steps.release.outputs.source_commit }}" \
            --source-tag "${RELEASE_TAG}" \
            --lockfile-sha256 "${{ steps.release.outputs.lockfile_sha256 }}" \
            --publication true --signed false

      - name: Verify unsigned Windows installer
        if: matrix.platform == 'win'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-packaged-desktop-startup.ts --assets-dir release --platform win --arch x64 --version "${{ steps.release.outputs.version }}"
          rm -f release/latest.yml release/*.exe.blockmap
          node scripts/write-release-artifact-provenance.ts \
            --assets-dir release --platform win --arch x64 --target nsis \
            --version "${{ steps.release.outputs.version }}" \
            --source-commit "${{ steps.release.outputs.source_commit }}" \
            --source-tag "${RELEASE_TAG}" \
            --lockfile-sha256 "${{ steps.release.outputs.lockfile_sha256 }}" \
            --publication true --signed false --allow-unsigned-windows-publication true

      - name: Attest release artifacts
        uses: actions/attest@v4
        with:
          subject-path: release/*

      - name: Retain exact release artifacts
        uses: actions/upload-artifact@v6
        with:
          name: penkra-${{ steps.release.outputs.version }}-${{ matrix.artifact }}
          path: release/*
          if-no-files-found: error
          retention-days: 30

  draft_release:
    name: Assemble immutable GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: penkra-*
          path: release
          merge-multiple: true

      - name: Write aggregate SHA-256 checksums
        working-directory: release
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          artifacts=(*.dmg *.zip *.blockmap *.yml *.AppImage *.exe)
          if (( ${#artifacts[@]} == 0 )); then
            echo "No release artifacts found for checksums." >&2
            exit 1
          fi
          sha256sum "${artifacts[@]}" | sort > SHA256SUMS.txt

      - name: Create or refresh draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            is_draft="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
            if [[ "$is_draft" != "true" ]]; then
              echo "Release $RELEASE_TAG is already published; refusing to replace it." >&2
              exit 1
            fi
            gh release upload "$RELEASE_TAG" release/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" release/* --repo "$GITHUB_REPOSITORY" --verify-tag --draft --generate-notes --title "Penkra $RELEASE_TAG" \
              --notes "**Windows notice:** The Windows x64 installer is intentionally unsigned in this initial release. Windows will show an Unknown publisher/SmartScreen warning, and this installer is manual-download only; Windows auto-updates remain disabled until signed distribution is available. Verify the installer with SHA256SUMS.txt and GitHub's build-provenance attestation."
          fi

  publish_release:
    name: Publish stable GitHub Release
    needs: draft_release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Publish the assembled release without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          is_draft="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
          if [[ "$is_draft" != "true" ]]; then
            echo "Release $RELEASE_TAG is not the draft assembled by this workflow." >&2
            exit 1
          fi
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          published="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease --jq '(.isDraft == false) and (.isPrerelease == false)')"
          if [[ "$published" != "true" ]]; then
            echo "Release $RELEASE_TAG did not become public stable." >&2
            exit 1
          fi
