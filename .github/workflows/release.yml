name: Release Penkra Desktop

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: penkra-desktop-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    name: Validate release source
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.release.outputs.version }}
      source_commit: ${{ steps.release.outputs.source_commit }}
      lockfile_sha256: ${{ steps.release.outputs.lockfile_sha256 }}
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve and validate release identity
        id: release
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Stable releases require an exact vMAJOR.MINOR.PATCH tag, got: $tag" >&2
            exit 1
          fi

          node --input-type=module - "$version" <<'NODE'
          import { readFileSync } from "node:fs";

          const version = process.argv[2];
          const manifests = [
            "apps/desktop/package.json",
            "apps/server/package.json",
            "apps/web/package.json",
            "packages/contracts/package.json",
          ];
          for (const manifest of manifests) {
            const actual = JSON.parse(readFileSync(manifest, "utf8")).version;
            if (actual !== version) {
              throw new Error(`${manifest} is ${actual}; release tag requires ${version}`);
            }
          }
          NODE

          source_commit="$(git rev-parse HEAD)"
          lockfile_sha256="$(shasum -a 256 bun.lock | awk '{print $1}')"
          {
            echo "version=$version"
            echo "source_commit=$source_commit"
            echo "lockfile_sha256=$lockfile_sha256"
          } >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify release source
        run: |
          bun run brand:check
          bun run fmt:check
          bun run lint
          bun run typecheck
          bun run test
          bun run release:smoke

  build:
    name: Build signed macOS arm64 release
    needs: preflight
    runs-on: macos-14
    timeout-minutes: 60
    environment: desktop-release
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build, sign, and notarize
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        shell: bash
        run: |
          set -euo pipefail
          required=(
            CSC_LINK
            CSC_KEY_PASSWORD
            APPLE_API_KEY
            APPLE_API_KEY_ID
            APPLE_API_ISSUER
          )
          for name in "${required[@]}"; do
            test -n "${!name:-}" || { echo "Missing required release secret: $name" >&2; exit 1; }
          done

          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY" > "$key_path"
          export APPLE_API_KEY="$key_path"

          bun run dist:desktop:artifact -- \
            --platform mac \
            --target dmg \
            --arch arm64 \
            --build-version "${{ needs.preflight.outputs.version }}" \
            --source-commit "${{ needs.preflight.outputs.source_commit }}" \
            --source-tag "${GITHUB_REF_NAME}" \
            --lockfile-sha256 "${{ needs.preflight.outputs.lockfile_sha256 }}" \
            --signed \
            --verbose

      - name: Verify updater artifact and public-package boundary
        shell: bash
        run: |
          set -euo pipefail
          bun run release:smoke:mac-update -- --artifact-dir release
          if ditto -l -k release/*.zip | grep -q '/Contents/Resources/penkra-cli/'; then
            echo "Public desktop artifact contains the private Penkra CLI." >&2
            exit 1
          fi

      - name: Write SHA-256 checksums
        working-directory: release
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          artifacts=(*.dmg *.zip *.blockmap *.yml)
          if (( ${#artifacts[@]} == 0 )); then
            echo "No release artifacts found for checksums." >&2
            exit 1
          fi
          shasum -a 256 "${artifacts[@]}" > SHA256SUMS.txt

      - name: Attest release artifacts
        uses: actions/attest@v4
        with:
          subject-path: release/*

      - name: Retain exact release artifacts
        uses: actions/upload-artifact@v6
        with:
          name: penkra-${{ needs.preflight.outputs.version }}-mac-arm64
          path: release/*
          if-no-files-found: error
          retention-days: 30

  draft_release:
    name: Create draft GitHub Release
    needs: [preflight, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified release artifacts
        uses: actions/download-artifact@v8
        with:
          name: penkra-${{ needs.preflight.outputs.version }}-mac-arm64
          path: release

      - name: Create or refresh draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            is_draft="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
            if [[ "$is_draft" != "true" ]]; then
              echo "Release $RELEASE_TAG is already published; refusing to replace it." >&2
              exit 1
            fi
            gh release upload "$RELEASE_TAG" release/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$RELEASE_TAG" release/* \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --draft \
              --generate-notes \
              --title "Penkra $RELEASE_TAG"
          fi
