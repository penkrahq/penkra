name: Release Penkra Desktop

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified artifacts to the production S3 update feed
        required: true
        default: false
        type: boolean

concurrency:
  group: penkra-desktop-production
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-14
    timeout-minutes: 45
    environment: production-desktop
    permissions:
      contents: read
    steps:
      - name: Check out Penkra app
        uses: actions/checkout@v7

      - name: Read pinned release metadata
        id: release
        run: |
          node --input-type=module <<'NODE'
          import release from "./scripts/penkra-release.json" with { type: "json" };
          if (!/^\d+\.\d+\.\d+$/.test(release.version)) throw new Error("Invalid release version");
          if (release.platform !== "mac" || release.arch !== "arm64") {
            throw new Error("The production release lane is macOS arm64 only");
          }
          console.log(`Preparing Penkra ${release.version} with backend ${release.backendRef}`);
          NODE
          node -e 'const fs=require("fs");const r=require("./scripts/penkra-release.json");fs.appendFileSync(process.env.GITHUB_OUTPUT,`version=${r.version}\nbackend_repository=${r.backendRepository}\nbackend_ref=${r.backendRef}\n`)'

      - name: Check out pinned backend CLI
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.release.outputs.backend_repository }}
          ref: ${{ steps.release.outputs.backend_ref }}
          token: ${{ secrets.BACKEND_REPOSITORY_TOKEN }}
          path: penkra-backend

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Install and validate app
        run: |
          bun install --frozen-lockfile
          bun run fmt:check
          bun run lint
          bun run typecheck
          bun run test

      - name: Build pinned backend CLI
        working-directory: penkra-backend
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @penkra/cli build:binary

      - name: Build signed macOS arm64 artifact
        env:
          PENKRA_CLI_BINARY: ${{ github.workspace }}/penkra-backend/apps/cli/dist/penkra
          PENKRA_UPDATE_TOKEN: ${{ secrets.PENKRA_UPDATE_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          required=(PENKRA_UPDATE_TOKEN CSC_LINK CSC_KEY_PASSWORD)
          for name in "${required[@]}"; do test -n "${!name}" || { echo "Missing $name"; exit 1; }; done
          if test -n "$APPLE_API_KEY" || test -n "$APPLE_API_KEY_ID" || test -n "$APPLE_API_ISSUER"; then
            required_notary=(APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER)
            for name in "${required_notary[@]}"; do
              test -n "${!name}" || { echo "Partial Apple notarization configuration: missing $name"; exit 1; }
            done
            key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
            printf '%s' "$APPLE_API_KEY" > "$key_path"
            export APPLE_API_KEY="$key_path"
          else
            echo "Building with the configured signing identity; notarization is not configured"
          fi
          bun run dist:desktop:artifact -- \
            --platform mac --target zip --arch arm64 \
            --build-version "${{ steps.release.outputs.version }}" --signed --verbose

      - name: Verify updater artifact
        run: bun run release:smoke:mac-update -- --artifact-dir release

      - name: Retain exact release artifacts
        uses: actions/upload-artifact@v6
        with:
          name: penkra-${{ steps.release.outputs.version }}-mac-arm64
          path: release/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish versioned files then manifest
        if: ${{ inputs.publish }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          PENKRA_RELEASE_BUCKET: ${{ secrets.PENKRA_RELEASE_BUCKET }}
          PENKRA_UPDATE_TOKEN: ${{ secrets.PENKRA_UPDATE_TOKEN }}
        run: bun run release:publish:s3 -- release
